# Copy to config/seed.yaml. Addresses and secret references here are examples.
application: goods
scope: scope:goods

# Optional: authenticated readers of this seed app can view these exact deployments.
# This grants metric reads only, never deployment operations. See docs/system-metrics.md.
# systemDeployments:
#   - environmentId: env-000000000001
#     deploymentId: goods-aws-example
#     ownerId: shared-demo
#     environment: aws

environments:
  aws:
    appUrl: http://10.10.0.10:8000
    trafficPool: aws
    actors: {goods-aws-api: 4, goods-aws-worker: 2}
  gcp:
    appUrl: http://10.20.0.10:8000
    trafficPool: gcp
    actors: {goods-gcp-api: 4, goods-gcp-worker: 2}

resources:
  database:
    profile: postgres-managed-logical-pgbouncer-v2
    gateNamespace: app:goods  # Must match this application's DB execution unit.
    source:
      host: goods.example.ap-northeast-2.rds.amazonaws.com
      port: 5432
      database: appdb
      secretRef: arn:aws:secretsmanager:ap-northeast-2:123456789012:secret:goods-rds-REPLACE
      provider: AWS_RDS
      providerInstance: arn:aws:rds:ap-northeast-2:123456789012:db:goods
      writerRole: goods_writer
    target:
      host: 10.21.0.5
      port: 5432
      database: appdb
      secretRef: arn:aws:secretsmanager:ap-northeast-2:123456789012:secret:goods-sql-REPLACE
      provider: GCP_CLOUDSQL
      providerInstance: projects/foxtrot/instances/goods
      writerRole: goods_writer
    # Managed DB profiles do not support REVERSE_REQUIRED.
    policy: {rollbackMode: BEFORE_TARGET_WRITE, maxQuiesceSeconds: 300}
    schema:
      tables: [public.join_requests, public.orders, public.groupbuys, public.chat_messages]
      sequences: []
  redis:
    source: {host: goods-redis.aws.internal, port: 6379, database: '0', secretRef: 'arn:aws:secretsmanager:ap-northeast-2:123456789012:secret:goods-redis-source'}
    target: {host: goods-redis.gcp.internal, port: 6379, database: '0', secretRef: 'arn:aws:secretsmanager:ap-northeast-2:123456789012:secret:goods-redis-target'}
    policy: {rollbackMode: REVERSE_REQUIRED, maxQuiesceSeconds: 1.8}
  object:
    sourceRef: resource:aws-receipts
    targetRef: resource:gcp-receipts
    bindingRef: binding:receipts
    expectedApps: 12
    policy: {rollbackMode: REVERSE_REQUIRED, maxQuiesceSeconds: 30}

# The seed belongs to one application. Each URL points to its fixed API+executor+proxy unit.
# A resource may override its endpoint with resources.<kind>.adapter using this same shape.
adapters:
  database: {url: "https://db-goods.internal:8080", tokenSecret: "env:DB_ADAPTER_TOKEN"}
  redis: {url: "http://redis-goods.internal:8090", tokenSecret: "env:REDIS_ADAPTER_TOKEN"}
  object: {url: "http://object-migration.internal:8080", tokenSecret: "env:OBJECT_ADAPTER_TOKEN"}

probe:
  user: probe-platform
  groupbuyId: 1
  cleanupPath: null

canaryWeights: [5]
trafficWeights: [50, 100]
